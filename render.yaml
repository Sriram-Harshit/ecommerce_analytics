services:
  - type: web
    name: ecommerce-analytics
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecommerce_analytics.wsgi:application --workers 1 --threads 4 --timeout 120 --keep-alive 5 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: ecommerce_analytics.settings
